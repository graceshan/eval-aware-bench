task:
  task: eval_aware_bench/eval_aware_bench
  args:
    pair_ids: [lyrics_purple_rain]
    valences: [capability, safety]
    conditions: [baseline, F8]
model:
  model: openrouter/openai/gpt-oss-120b
  base_url: https://openrouter.ai/api/v1
  config:
    temperature: 0.3
    max_tokens: 4096
    reasoning_effort: high
  args:
    stream: false
    responses_api: false
    max_retries: 0  # Disable nested SDK retries.
model_roles:
  grader:
    model: openrouter/openai/gpt-5
    base_url: https://openrouter.ai/api/v1
    config:
      max_retries: 1
    args:
      stream: false
      responses_api: false
      max_retries: 0
generate_config:
  max_retries: 1  # Inspect handles transient request failures.
  cache: false
eval_config:
  epochs: 1
  max_samples: 1  # Run the four dataset samples sequentially.
  fail_on_error: true
  continue_on_fail: false
  retry_on_error: 0
  score_on_error: false
  log_samples: true
  log_model_api: true
