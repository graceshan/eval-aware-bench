task:
  task: eval_aware_bench/eval_aware_bench
  args:
    pair_ids: all
    valences: all
    conditions: all
model:
  model: openrouter/openai/gpt-oss-120b
  base_url: https://openrouter.ai/api/v1
  config:
    temperature: 0.3
    max_tokens: 4096
    reasoning_effort: high
    max_connections: 10
  args:
    stream: false
    responses_api: false
    max_retries: 0
model_roles:
  grader:
    model: openrouter/openai/gpt-5  # The upstream judge used direct OpenAI.
    base_url: https://openrouter.ai/api/v1
    config:
      max_connections: 20
      max_retries: 1
      cache: false
    args:
      responses_api: false
      stream: false
      max_retries: 0
generate_config:
  max_retries: 1
  cache: false
eval_config:
  epochs: 3
  retry_on_error: 0
  fail_on_error: false
  score_on_error: false
  log_samples: true
  log_model_api: true
